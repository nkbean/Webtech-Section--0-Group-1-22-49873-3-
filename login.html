<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Bhromon Sathi</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="page">

    <div class="left-side">
      <h1 class="logo">Bhromon Sathi</h1>
      <div class="left-text">
        <p>Cox's Bazar, Chattogram</p>
        <h2>Explore Bangladesh with us.</h2>
      </div>
    </div>

    <div class="right-side">
      <div class="container">
        <h2>Welcome back</h2>
        <p class="sub-text">Log in to your account</p>

        <form id="loginForm" novalidate>

          <div class="form-group">
            <label>Login as</label>
            <div class="options">
              <label><input type="radio" name="role" value="Traveller"> Traveller</label>
              <label><input type="radio" name="role" value="Hotel Manager"> Hotel Manager</label>
              <label><input type="radio" name="role" value="Admin"> Admin</label>
            </div>
            <span class="error" id="roleError"></span>
          </div>

          <div class="form-group">
            <label for="username">Username / Email / Hotel ID</label>
            <input type="text" id="username" placeholder="Enter your username">
            <span class="error" id="usernameError"></span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
            <span class="error" id="passwordError"></span>
          </div>

          <div class="form-group">
            <label class="show-pass"><input type="checkbox" id="showPassword"> Show password</label>
          </div>

          <button type="submit">Log In</button>
        </form>

        <p class="bottom-text">Don't have an account? <a href="register.html">Create new account</a></p>
      </div>
    </div>

  </div>

  <script src="login.js"></script>
</body>
</html>
